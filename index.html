<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Biens à visiter en 360° à Los Santos : appartements, maisons, bureaux. Prix, infos et visite virtuelle.">
<meta property="og:type" content="website">
<meta property="og:title" content="Catalogue Dynasty 8">
<meta property="og:description" content="Biens à visiter en 360° à Los Santos : prix, infos et visite virtuelle.">
<meta property="og:image" content="https://nilowoff.github.io/dynasty8/preview.jpg">
<meta property="og:url" content="https://nilowoff.github.io/dynasty8/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#025934">
<link rel="icon" href="logo.png">
<title>Catalogue Dynasty 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout : vitrine d'agence. Bandeau papier avec le logo, grille de fiches (photo, pastille-soleil 360°,
   prix en vert), la visite s'ouvre en plein écran par-dessus ; le mode agent ajoute une barre jaune. */
:root {
  --green: #025934;
  --green-deep: #013a22;
  --green-soft: #e4efe8;
  --sun: #fdc614;
  --sun-soft: #fff3c4;
  --paper: #f5f3ea;
  --card: #ffffff;
  --ink: #121412;
  --ink-2: #4a514b;
  --ink-3: #7b827c;
  --line: rgba(18, 20, 18, 0.12);
  --danger: #b3261e;
  --glass: rgba(1, 46, 27, 0.74);
  --white: #f7f7f1;
  --white-soft: rgba(247, 247, 241, 0.74);
  --display: 'Righteous', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --label: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --gutter: 16px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body.visit-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* ---------- boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--white); }
.btn.primary:hover { background: var(--green-deep); }
.btn.sun { background: var(--sun); border-color: var(--sun); color: var(--ink); }
.btn.danger { color: var(--danger); border-color: rgba(179, 38, 30, .35); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center;
  border: 1px solid var(--line); background: var(--card); padding: 0;
}
.iconbtn svg { width: 18px; height: 18px; }

/* ---------- en-tête ---------- */
.top {
  background: var(--card); border-bottom: 4px solid var(--sun);
}
.top-inner {
  max-width: 1240px; margin: 0 auto; padding: 12px var(--gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.top .logo { height: 54px; width: auto; display: block; }
.top-actions { display: flex; gap: 8px; align-items: center; }

.agentbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--sun); color: var(--ink);
}
.agentbar-inner {
  max-width: 1240px; margin: 0 auto; padding: 8px var(--gutter);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.agentbar .tag {
  font-family: var(--label); font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: 13px;
  background: var(--ink); color: var(--sun); padding: 3px 9px; border-radius: 3px;
}
.agentbar .state { font-family: var(--label); font-weight: 600; font-size: 16px; flex: 1 1 auto; min-width: 0; }
.agentbar .btn { min-height: 36px; }

/* ---------- catalogue ---------- */
.catalog { max-width: 1240px; margin: 0 auto; padding: 28px var(--gutter) 64px; }
.cat-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.cat-head h1 {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.05;
  letter-spacing: .005em; text-wrap: balance;
}
.cat-head .sub { margin: 6px 0 0; color: var(--ink-2); font-family: var(--label); font-size: 18px; font-weight: 500; letter-spacing: .02em; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 22px 0 22px; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px;
  font-family: var(--label); font-weight: 600; font-size: 15px; letter-spacing: .04em;
}
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--white); }
.filters .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.filters select, .filters input[type="search"] {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; min-height: 36px;
  font-family: var(--label); font-weight: 600; font-size: 15px;
}
.filters input[type="search"] { min-width: 0; flex: 1 1 180px; max-width: 280px; font-family: var(--body); font-weight: 400; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
.card {
  position: relative; display: flex; flex-direction: column; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; padding: 0;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(1, 58, 34, .14); }
.card .photo { position: relative; aspect-ratio: 16 / 10; background: #d9ddd6 center / cover no-repeat; max-width: 100%; }
.card .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.28)); }
.sunbadge {
  position: absolute; top: 12px; right: 12px; z-index: 1;
  width: 62px; height: 62px; border-radius: 50%; background: var(--sun); color: var(--ink);
  display: grid; place-content: center; text-align: center; line-height: 1;
  font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .02em;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}
.sunbadge small { display: block; margin-top: 1px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.status {
  position: absolute; left: 12px; bottom: 12px; z-index: 1;
  font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 3px; background: var(--green); color: var(--white);
}
.status.reserve { background: var(--sun); color: var(--ink); }
.status.vendu, .status.loue { background: var(--ink); color: var(--white); }
.card .body { padding: 14px 16px 16px; display: grid; gap: 4px; }
.eyebrow {
  margin: 0; font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--green);
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 23px; line-height: 1.12; text-wrap: balance; }
.price { margin: 4px 0 0; font-family: var(--label); font-weight: 700; font-size: 26px; color: var(--green); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.price small { font-size: 16px; font-weight: 600; color: var(--ink-2); }
.price.ask { font-size: 20px; color: var(--ink-2); }
.specs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 0; color: var(--ink-2); font-family: var(--label); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.card .agent-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
.card .agent-actions .btn { min-height: 34px; font-size: 14px; }
.card.new {
  border: 2px dashed rgba(2, 89, 52, .4); background: transparent; min-height: 280px;
  display: grid; place-items: center; text-align: center; color: var(--green);
}
.card.new .plus { width: 60px; height: 60px; border-radius: 50%; background: var(--sun); color: var(--ink); display: grid; place-items: center; margin: 0 auto 10px; }
.card.new .plus svg { width: 26px; height: 26px; }
.card.new span { font-family: var(--label); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; }
.empty { padding: 48px 16px; text-align: center; color: var(--ink-2); font-family: var(--label); font-size: 19px; }
.foot { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter) 40px; color: var(--ink-3); font-size: 13px; }

/* ---------- visite ---------- */
.visit { position: fixed; inset: 0; z-index: 40; background: var(--green-deep); color: var(--white); font-family: var(--label); overflow: hidden; }
.stage { position: absolute; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--green-deep) center / cover no-repeat; }
.stage.dragging { cursor: grabbing; }
.stage.over-link { cursor: pointer; }
.stage.placing { cursor: crosshair; }
.stage canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .5s ease; }
.stage.ready canvas { opacity: 1; }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.vcard {
  position: absolute; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + var(--gutter)); left: calc(env(safe-area-inset-left, 0px) + var(--gutter));
  width: min(300px, calc(100vw - 2 * var(--gutter) - 108px));
  display: grid; gap: 8px;
}
.backpill {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px;
  background: var(--glass); color: var(--white); border: 1px solid rgba(247,247,241,.2); border-radius: 999px;
  padding: 6px 13px 6px 9px; font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.backpill svg { width: 16px; height: 16px; }
.vpaper { background: var(--paper); color: var(--ink); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.35); overflow: hidden; }
.vpaper .brand { display: block; padding: 12px 16px 8px; }
.vpaper .brand img { display: block; width: 132px; max-width: 100%; height: auto; }
.vpaper .info { display: grid; gap: 2px; padding: 9px 16px 12px; border-top: 1px solid var(--line); }
.vpaper h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(19px, 3.4vw, 24px); line-height: 1.1; text-wrap: balance; }
.vpaper .room { margin: 0; font-family: var(--label); font-size: 15px; font-weight: 600; color: var(--ink-2); }
.vpaper .room::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 50%; background: var(--sun); vertical-align: 1px; }
.vpaper .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.vpaper .price { margin: 0; font-size: 22px; }
.vpaper .price.ask { font-size: 17px; }
.vpaper .btn { min-height: 32px; padding: 0 12px; font-size: 13px; }

.vcontrols { position: absolute; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + var(--gutter)); right: calc(env(safe-area-inset-right, 0px) + var(--gutter)); display: flex; gap: 8px; }
.rbtn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: var(--green); color: var(--white); border: 1px solid rgba(247,247,241,.22); box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.rbtn:hover { background: var(--green-deep); }
.rbtn[aria-pressed="true"] { background: var(--sun); color: var(--ink); border-color: var(--sun); }
.rbtn svg { width: 20px; height: 20px; }
.vzoom { position: absolute; z-index: 5; right: calc(env(safe-area-inset-right, 0px) + var(--gutter)); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter)); display: grid; gap: 8px; }
.vzoom .rbtn { border-radius: 6px; }

.hint {
  position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter) + 4px);
  box-sizing: border-box; max-width: calc(100vw - 2 * (var(--gutter) + 56px)); width: max-content;
  padding: 8px 16px; border-radius: 22px; background: var(--green); color: var(--white);
  box-shadow: 0 6px 18px rgba(0,0,0,.3); font-size: 15px; font-weight: 600; letter-spacing: .03em; text-align: center; line-height: 1.25;
  pointer-events: none; transition: opacity .5s ease;
}
.hint.gone { opacity: 0; }
.hint.top { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + var(--gutter) + 56px); background: var(--sun); color: var(--ink); pointer-events: auto; }
.vstatus {
  position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
  padding: 10px 16px; border-radius: 6px; background: var(--paper); color: var(--ink); font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.3);
}

.pin { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--white); pointer-events: auto; font: inherit; }
.pin .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--sun); border: 3px solid var(--green); box-shadow: 0 0 0 3px rgba(253,198,20,.38), 0 2px 8px rgba(0,0,0,.4); }
.pin .tag { padding: 4px 10px; border-radius: 4px; background: var(--green); border: 1px solid rgba(247,247,241,.2); box-shadow: 0 4px 12px rgba(0,0,0,.3); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.pin .more { display: block; font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 14px; color: var(--white-soft); }
.pin:not(.open) .more { display: none; }
.link-label {
  position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px;
  padding: 6px 13px 6px 9px; border-radius: 999px; background: var(--green); color: var(--white); border: 2px solid var(--sun);
  box-shadow: 0 4px 14px rgba(0,0,0,.35); font: 700 13px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
  pointer-events: auto; transition: background .15s, color .15s;
}
.link-label svg { width: 16px; height: 16px; color: var(--sun); flex: none; }
.link-label:hover, .link-label.hot { background: var(--sun); color: var(--ink); }
.link-label:hover svg, .link-label.hot svg { color: var(--ink); }

/* barre d'outils agent dans la visite */
.vtools {
  position: absolute; z-index: 7; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gutter));
  display: flex; gap: 6px; padding: 6px; border-radius: 12px; background: var(--sun); box-shadow: 0 8px 22px rgba(0,0,0,.35);
  max-width: calc(100vw - 2 * var(--gutter) - 60px); overflow-x: auto;
}
.vtools button {
  display: grid; justify-items: center; gap: 2px; min-width: 70px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: var(--ink);
  font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
}
.vtools button:hover, .vtools button[aria-pressed="true"] { background: rgba(18,20,18,.12); }
.vtools svg { width: 20px; height: 20px; }

/* ---------- panneau latéral ---------- */
.sheet {
  position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
  background: var(--paper); color: var(--ink); box-shadow: -12px 0 40px rgba(0,0,0,.3);
  display: flex; flex-direction: column; font-family: var(--body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet header h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.sheet .sbody { flex: 1 1 auto; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.sheet footer { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  .sheet { top: auto; left: 0; width: 100vw; max-height: 82vh; border-radius: 14px 14px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.3); }
}
.field { display: grid; gap: 5px; }
.field > span { font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 11px;
}
.field textarea { min-height: 96px; resize: vertical; }
.field .help { font-size: 13px; color: var(--ink-3); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 > * { min-width: 0; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
.kv dt { font-family: var(--label); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 2px 0 0; font-family: var(--label); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.desc { white-space: pre-wrap; margin: 0; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 3px 10px; font-family: var(--label); font-weight: 700; font-size: 14px; }
.roomlist { display: grid; gap: 8px; }
.roomitem {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: left;
}
.roomitem .thumb { width: 64px; height: 40px; border-radius: 5px; background: #cfd4cc center / cover no-repeat; }
.roomitem b { font-family: var(--label); font-weight: 700; font-size: 16px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roomitem small { color: var(--ink-3); font-size: 12px; }
.roomitem .acts { display: flex; gap: 4px; }
.roomitem .acts button { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; padding: 0; }
.roomitem .acts svg { width: 16px; height: 16px; }
.roomitem.current { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.note { background: var(--sun-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--ink); }
.note.error { background: #fbe4e2; color: #6d1510; }
.copyrow { display: flex; gap: 8px; }
.copyrow input { flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); font-size: 13px; }

/* ---------- assistant d'assemblage ---------- */
.wizard { position: fixed; inset: 0; z-index: 70; background: var(--paper); color: var(--ink); overflow-y: auto; font-family: var(--body); }
.wiz-head { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 4px solid var(--sun); }
.wiz-head .in { max-width: 1240px; margin: 0 auto; padding: 12px var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wiz-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; }
.wiz-body { max-width: 1240px; margin: 0 auto; padding: 22px var(--gutter) 60px; display: grid; gap: 18px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.steps span[aria-current="step"] { color: var(--green); }
.steps span + span::before { content: '›'; margin-right: 6px; color: var(--ink-3); }
.drop {
  border: 2px dashed rgba(2,89,52,.45); border-radius: 12px; background: var(--card); padding: 34px 16px; text-align: center; display: grid; gap: 10px; justify-items: center;
}
.drop.over { background: var(--green-soft); }
.drop b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.drop p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.thumb-card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; }
.thumb-card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; max-width: 100%; }
.thumb-card .num { position: absolute; top: 4px; left: 4px; background: rgba(18,20,18,.7); color: #fff; font-family: var(--label); font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 3px; }
.thumb-card select { border: 0; border-top: 1px solid var(--line); background: var(--card); padding: 5px 6px; font-family: var(--label); font-weight: 700; font-size: 14px; }
.thumb-card.bad { border-color: var(--danger); }
.thumb-card.sel { box-shadow: 0 0 0 2px var(--green); }
.progress { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.progress .bar { height: 10px; background: var(--green-soft); border-radius: 999px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--green); transition: width .2s; }
.progress b { font-family: var(--label); font-weight: 700; font-size: 18px; }
.result { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .result { grid-template-columns: 1fr; } }
.preview360 { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--green-deep); }
.preview360 .stage { position: absolute; inset: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.panel h4 { margin: 0; font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--green); }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-family: var(--label); font-weight: 600; }
.slider output { text-align: right; font-variant-numeric: tabular-nums; }
.slider input { width: 100%; accent-color: var(--green); }

/* ---------- divers ---------- */
.toast {
  position: fixed; z-index: 90; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%);
  max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 8px; background: var(--ink); color: var(--white);
  font-family: var(--label); font-weight: 600; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3);
}
.modal { position: fixed; inset: 0; z-index: 95; background: rgba(18,20,18,.5); display: grid; place-items: center; padding: 16px; }
.modal .box { background: var(--paper); border-radius: 12px; padding: 18px; width: min(440px, 100%); display: grid; gap: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; }
.modal p { margin: 0; color: var(--ink-2); }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 640px) {
  .top .logo { height: 42px; }
  .grid { gap: 16px; }
  .vpaper .brand img { width: 108px; }
  .vtools button { min-width: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <img class="logo" src="logo.png" alt="Dynasty 8" width="104" height="54">
    <div class="top-actions">
      <button class="btn" id="agentBtn" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Mode agent</span>
      </button>
    </div>
  </div>
</header>

<div class="agentbar" id="agentbar" hidden>
  <div class="agentbar-inner">
    <span class="tag">Mode agent</span>
    <span class="state" id="agentState">Aucune modification</span>
    <button class="btn primary" id="saveBtn" type="button" disabled>Enregistrer</button>
    <button class="btn ghost" id="agentExit" type="button">Quitter</button>
    <button class="btn ghost" id="agentLogout" type="button" hidden>Déconnexion</button>
  </div>
</div>

<main class="catalog" id="catalog">
  <div class="cat-head">
    <div>
      <h1>Biens à visiter en 360°</h1>
      <p class="sub" id="catSub">Los Santos</p>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Aucun bien ne correspond à ces critères.</p>
</main>
<p class="foot">Visites 360° réalisées à partir de captures en jeu. <button type="button" id="agentLink" hidden style="border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit">Espace agent</button></p>

<section class="visit" id="visit" hidden>
  <div class="stage" id="stage" role="img" aria-label="Vue à 360 degrés. Glissez ou utilisez les flèches du clavier pour regarder autour."></div>
  <div class="overlay" id="overlay"></div>
  <div class="vcard">
    <button class="backpill" id="backBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Catalogue
    </button>
    <div class="vpaper">
      <span class="brand"><img src="logo.png" alt="Dynasty 8" width="132" height="69"></span>
      <div class="info">
        <p class="eyebrow" id="vEyebrow"></p>
        <h1 id="vName"></h1>
        <p class="room" id="vRoom"></p>
        <div class="row">
          <p class="price" id="vPrice"></p>
          <button class="btn" id="infoBtn" type="button">Infos</button>
        </div>
      </div>
    </div>
  </div>
  <div class="vcontrols">
    <button class="rbtn" id="rotateBtn" type="button" aria-pressed="true" aria-label="Rotation automatique" title="Rotation automatique">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
    </button>
    <button class="rbtn" id="fullBtn" type="button" aria-label="Plein écran" title="Plein écran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="vzoom">
    <button class="rbtn" id="zoomIn" type="button" aria-label="Zoomer" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="rbtn" id="zoomOut" type="button" aria-label="Dézoomer" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  </div>
  <div class="hint" id="vHint">Glissez pour regarder, cliquez les cercles au sol pour avancer</div>
  <div class="hint top" id="placeHint" hidden></div>
  <div class="vstatus" id="vStatus" hidden>Chargement de la visite…</div>
  <div class="vtools" id="vtools" hidden>
    <button type="button" data-tool="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Vue de départ</button>
    <button type="button" data-tool="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Étiquette</button>
    <button type="button" data-tool="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="17" rx="8" ry="3"/><path d="M12 13V3M8 7l4-4 4 4"/></svg>Passage</button>
    <button type="button" data-tool="north"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l3 8-3-2-3 2Z"/></svg>Orientation</button>
    <button type="button" data-tool="cover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Couverture</button>
    <button type="button" data-tool="rooms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M17.5 14v7M14 17.5h7"/></svg>Pièces</button>
  </div>
</section>

<aside class="sheet" id="sheet" hidden aria-modal="false">
  <header><h3 id="sheetTitle"></h3><button class="iconbtn" id="sheetClose" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="sbody" id="sheetBody"></div>
  <footer id="sheetFoot" hidden></footer>
</aside>

<div class="wizard" id="wizard" hidden>
  <div class="wiz-head"><div class="in"><h2 id="wizTitle">Nouvelle pièce</h2><button class="btn" id="wizClose" type="button">Fermer</button></div></div>
  <div class="wiz-body" id="wizBody"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="modal" id="modal" hidden><div class="box"><h3 id="modalTitle"></h3><p id="modalText"></p><div class="acts" id="modalActs"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="stitcher.js"></script>
<script src="viewer.js"></script>
<script src="app.js"></script>

</body>
</html>
